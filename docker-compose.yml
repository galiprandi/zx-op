services:
  postgres:
    image: postgres:16-alpine
    container_name: zx-op-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zx_op}
      POSTGRES_USER: ${POSTGRES_USER:-zx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zx_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zx_user} -d ${POSTGRES_DB:-zx_op}" ]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: zx-op-api:local
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: zx-op-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${API_PORT:-3000}
      ENABLE_HTTPS: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-zx_user}:${POSTGRES_PASSWORD:-zx_password}@postgres:5432/${POSTGRES_DB:-zx_op}
    ports:
      - "${API_PORT:-3000}:3000"

  ui:
    image: zx-op-ui:local
    build:
      context: .
      dockerfile: ui/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://127.0.0.1}
        VITE_API_BASE_PORT: ${API_PORT:-3000}
    container_name: zx-op-ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${UI_PORT:-4173}:4173"

volumes:
  postgres_data:
