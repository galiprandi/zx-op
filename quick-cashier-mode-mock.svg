<svg width="1200" height="1900" viewBox="0 0 1200 1900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title { font: 700 54px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 28px 'Segoe UI', sans-serif; fill: #94a3b8; }
      .label { font: 600 26px 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .value { font: 800 52px 'Segoe UI', sans-serif; fill: #22c55e; }
      .chip { font: 700 28px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .btn { font: 700 34px 'Segoe UI', sans-serif; fill: #0b1020; }
      .btn2 { font: 700 30px 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .tiny { font: 500 22px 'Segoe UI', sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="1900" fill="url(#bg)"/>

  <text x="70" y="110" class="title">Modo Caja Rapida</text>
  <text x="70" y="155" class="subtitle">2 taps en cobro estandar · optimizado para POSNET/Transferencia</text>

  <rect x="60" y="200" rx="24" ry="24" width="1080" height="220" fill="#111827" stroke="#334155"/>
  <text x="95" y="265" class="label">Pulsera</text>
  <text x="95" y="325" class="title" style="font-size:48px">ZX-004219</text>
  <text x="850" y="265" class="label">Caja</text>
  <rect x="850" y="285" rx="14" ry="14" width="230" height="76" fill="#1d4ed8"/>
  <text x="900" y="335" class="chip">Caja 1</text>

  <rect x="60" y="450" rx="24" ry="24" width="1080" height="220" fill="#111827" stroke="#334155"/>
  <text x="95" y="515" class="label">Total a cobrar</text>
  <text x="95" y="605" class="value">$ 24.000</text>
  <text x="95" y="645" class="tiny">(monto entero, sin decimales)</text>

  <rect x="60" y="700" rx="24" ry="24" width="1080" height="520" fill="#111827" stroke="#334155"/>
  <text x="95" y="765" class="label">Medio de pago (preseleccionado)</text>

  <rect x="95" y="810" rx="16" ry="16" width="1010" height="100" fill="#166534"/>
  <text x="130" y="872" class="chip">✓ Efectivo</text>
  <text x="965" y="872" class="chip" text-anchor="end">$ 24.000</text>

  <rect x="95" y="930" rx="16" ry="16" width="490" height="90" fill="#1f2937" stroke="#374151"/>
  <text x="130" y="988" class="chip">+ Debito</text>

  <rect x="615" y="930" rx="16" ry="16" width="490" height="90" fill="#1f2937" stroke="#374151"/>
  <text x="650" y="988" class="chip">+ Transferencia</text>

  <text x="95" y="1085" class="tiny">Accesos rapidos:</text>
  <rect x="95" y="1110" rx="14" ry="14" width="240" height="70" fill="#1e3a8a"/>
  <text x="140" y="1155" class="chip">TOTAL</text>
  <rect x="355" y="1110" rx="14" ry="14" width="240" height="70" fill="#1e3a8a"/>
  <text x="400" y="1155" class="chip">MITAD</text>
  <rect x="615" y="1110" rx="14" ry="14" width="240" height="70" fill="#1e3a8a"/>
  <text x="648" y="1155" class="chip">RESTANTE</text>

  <rect x="60" y="1260" rx="24" ry="24" width="1080" height="170" fill="#111827" stroke="#334155"/>
  <text x="95" y="1325" class="label">Restante</text>
  <text x="420" y="1325" class="tiny">rojo = falta · verde = sobra · negro = justo</text>
  <text x="95" y="1390" class="title" style="font-size:52px; fill:#f8fafc;">$ 0</text>

  <rect x="60" y="1470" rx="24" ry="24" width="1080" height="130" fill="#22c55e"/>
  <text x="600" y="1550" class="btn" text-anchor="middle">CONFIRMAR COBRO</text>

  <rect x="60" y="1625" rx="20" ry="20" width="1080" height="210" fill="#0b1220" stroke="#334155"/>
  <text x="95" y="1690" class="label">Estado optimista</text>
  <text x="95" y="1750" class="subtitle">Confirmando cobro... no cerrar hasta respuesta API</text>
  <text x="95" y="1805" class="tiny">Luego: Exito y reset automatico para siguiente pulsera</text>
</svg>
